name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<'NOTES'
          BUGFIX

          - Исправлено чтение новостей нового формата из manifest.json.
          - Лаунчер теперь поддерживает новости текстом, картинками и HTML.
          - Сохранена совместимость со старым форматом news как массивом строк.
          - Обновление нужно для manifest.json после добавления новостей через minivibe admin.
          - Windows installer, Windows portable и experimental macOS сборки входят в релиз.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION.zip"
            "launcher/Minivibe-$VERSION-WIN-portable.zip"
          )

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
          fi
