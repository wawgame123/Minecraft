name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<'NOTES'
          BUGFIX

          - Исправлен краш при поиске NeoForge: чужие или битые .json в выбранной папке версии теперь пропускаются.
          - В опубликованные сборки больше не кладутся debug symbols, поэтому crash report не будет показывать путь к исходникам на машине сборки.
          - В релиз входят два установщика: автономный с .NET внутри и маленький no-dotnet для ПК с установленным .NET.
          - Windows portable и experimental macOS сборки тоже входят в релиз.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION.exe"
            "launcher/MinivibeInstaller-$VERSION-no-dotnet.exe"
            "launcher/Minivibe-$VERSION-WIN-portable.zip"
          )

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
          fi
