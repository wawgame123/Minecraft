name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<NOTES
          minivibe $VERSION

          - Лаунчер перед запуском Minecraft синхронизирует все GitHub-скины в локальный кэш OfflineSkins.
          - Скины сохраняются по нику, lower-case алиасу и offline UUID, чтобы OfflineSkins находил их стабильнее.
          - Если GitHub временно недоступен, запуск Minecraft продолжается со старым локальным кэшем.
          - Фиолетово-черные missing texture должны пропасть, потому что игра больше не зависит от скачивания скина в момент рендера.
          - macOS архивы содержат Run-Minivibe.command и сохраняют execute-bit для запуска после распаковки.
          - Windows portable, два Windows-установщика и experimental macOS сборки входят в релиз.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION.exe"
            "launcher/MinivibeInstaller-$VERSION-no-dotnet.exe"
            "launcher/Minivibe-$VERSION-WIN-portable.zip"
          )

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME" --notes-file release-notes.md
          fi
