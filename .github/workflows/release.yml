name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<'NOTES'
          BUGFIX

          - Лаунчер распознает уже установленный NeoForge профиль в versions/neoforge-21.1.228.
          - Если в существующей .minecraft уже есть профиль и jar версии, NeoForge installer не запускается заново без необходимости.
          - Лишняя докачка loader-файлов сокращена при выборе уже использованной папки Minecraft.
          - Добавлена отдельная experimental macOS версия на Avalonia: osx-arm64 и osx-x64.
          - Автообновление лаунчера продолжает работать через launcher/update.json.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION-framework.zip"
            "launcher/Minivibe-$VERSION-framework.zip"
          )

          if compgen -G "launcher/MinivibeMac-$VERSION-osx-*.zip" > /dev/null; then
            ASSETS+=(launcher/MinivibeMac-"$VERSION"-osx-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME BUGFIX" --notes-file release-notes.md
          fi
