name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<NOTES
          minivibe $VERSION

          - Типы модов в настройках теперь свернуты в список.
          - После самообновления manifest.json проверяется сразу после перезапуска лаунчера.
          - update.json указывает на новые архивы $VERSION и включает патчи от 0.4.0 и 0.4.1.
          NOTES

          ASSETS=()

          for asset in \
            "launcher/MinivibeInstaller-$VERSION.exe" \
            "launcher/MinivibeInstaller-$VERSION-no-dotnet.exe" \
            "launcher/Minivibe-$VERSION-WIN-portable.zip"; do
            if [ -f "$asset" ]; then
              ASSETS+=("$asset")
            fi
          done

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found for $VERSION"
            exit 1
          fi

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${PRERELEASE_ARGS[@]}" --title "minivibe $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" "${PRERELEASE_ARGS[@]}" --title "minivibe $TAG_NAME" --notes-file release-notes.md
          fi
