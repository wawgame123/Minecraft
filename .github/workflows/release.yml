name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<NOTES
          minivibe $VERSION

          - OfflineSkins теперь берет скины из GitHub-каталога minivibe без приоритета Mojang/Crafatar fallback.
          - При загрузке скина сохраняется alias ника в нижнем регистре, чтобы регистр пути на GitHub не ломал скин.
          - При смене конфига OfflineSkins лаунчер очищает старый кэш скинов, оставляя локальный скин текущего игрока.
          - Убраны автоматические G1GC/JVM-параметры запуска; RAM и пользовательские аргументы остались под контролем игрока.
          - Windows portable, два Windows-установщика и experimental macOS сборки входят в релиз.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION.exe"
            "launcher/MinivibeInstaller-$VERSION-no-dotnet.exe"
            "launcher/Minivibe-$VERSION-WIN-portable.zip"
          )

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME" --notes-file release-notes.md
          fi
