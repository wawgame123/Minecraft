name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          cat > release-notes.md <<NOTES
          minivibe $VERSION

          - Окно Windows-лаунчера автоматически уменьшается под рабочую область небольших экранов.
          - Поиск установленного NeoForge дополнительно проверяет JAR с именем версии и JAR с именем папки сборки.
          - Windows portable теперь self-contained и не требует отдельной установки .NET Runtime.
          - Исправлена компоновка установщика при DPI-масштабировании: кнопки выбора папки и установки больше не обрезаются.
          - Windows portable, два Windows-установщика и macOS arm64/x64 сборки входят в релиз.
          NOTES

          ASSETS=(
            "launcher/MinivibeInstaller-$VERSION.exe"
            "launcher/MinivibeInstaller-$VERSION-no-dotnet.exe"
            "launcher/Minivibe-$VERSION-WIN-portable.zip"
          )

          if compgen -G "launcher/Minivibe-$VERSION-MAC-*.zip" > /dev/null; then
            ASSETS+=(launcher/Minivibe-"$VERSION"-MAC-*.zip)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "minivibe $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --title "minivibe $TAG_NAME" --notes-file release-notes.md
          fi
